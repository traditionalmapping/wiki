<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Traditional Mapping Wiki</title>
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Traditional Mapping Wiki">
  <meta property="og:title" content="Traditional Mapping Wiki">
  <meta property="og:description" content="Interactive map of World War II: historical borders, countries, leaders and videos.">
  <meta property="og:url" content="https://traditionalmapping.github.io/wiki/">
  <meta property="og:image" content="https://traditionalmapping.github.io/wiki/preview.png?v=2">
  <meta property="og:image:alt" content="Traditional Mapping Wiki map preview">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#c9a24b">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/continents.css">
  <link rel="stylesheet" href="css/countries.css">
</head>
<body>
  <div id="map"></div>
  <div class="coords" id="coords">
    <span class="coords-text" id="coords-text">--, --</span>
    <button type="button" id="coords-copy" title="Copy coordinates of the cross">Copy</button>
  </div>
  <div class="crosshair" aria-hidden="true"></div>
  <div id="menu" class="menu" role="dialog" aria-labelledby="menu-title">
    <div class="menu-inner">
      <h1 id="menu-title">Periods</h1>
      <p class="menu-sub">Traditional Mapping Wiki</p>
      <div class="menu-grid">
        <button type="button" class="period" disabled>
          <span class="period-name">World War I</span>
          <span class="period-dates">1914 – 1918</span>
          <span class="period-badge">WIP</span>
        </button>
        <button type="button" class="period" disabled>
          <span class="period-name">Interwar</span>
          <span class="period-dates">1918 – 1939</span>
          <span class="period-badge">WIP</span>
        </button>
        <button type="button" class="period period-open" id="open-ww2">
          <span class="period-name">World War II</span>
          <span class="period-dates">1939 – 1945</span>
        </button>
        <button type="button" class="period" disabled>
          <span class="period-name">Cold War</span>
          <span class="period-dates">1947 – 1991</span>
          <span class="period-badge">WIP</span>
        </button>
        <button type="button" class="period" disabled>
          <span class="period-name">Modern Wars</span>
          <span class="period-dates">1991 – today</span>
          <span class="period-badge">WIP</span>
        </button>
      </div>
      <p class="menu-credits">Created by <span class="menu-credits-names">BerlinInANutshell &amp; Balkaninanutshell</span></p>
      <p class="menu-credits menu-idea">Main idea by <span class="menu-credits-names">Balkaninanutshell</span></p>
    </div>
  </div>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
  <script src="js/basemaps.js"></script>
  <script src="js/search.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/places.js"></script>
  <script src="js/markers.js"></script>
  <script src="js/countries.js"></script>
  <script src="js/continents.js"></script>
  <script src="js/history.js"></script>
  <script src="js/borders.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
